<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="一个支持桌面和手机游玩的传统俄罗斯方块小游戏。">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>传统俄罗斯方块</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./site.webmanifest">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="game-shell">
    <section class="board-panel">
      <canvas id="game" width="300" height="600" aria-label="俄罗斯方块游戏棋盘"></canvas>
      <div class="touch-controls" aria-label="手机触控按钮">
        <div class="pad move-pad" aria-label="方向键">
          <button class="action-btn action-btn-left" type="button" data-action="left">←</button>
          <button class="action-btn action-btn-down" type="button" data-action="down">↓</button>
          <button class="action-btn action-btn-right" type="button" data-action="right">→</button>
        </div>
        <div class="pad action-pad" aria-label="动作键">
          <button class="action-btn action-btn-rotate" type="button" data-action="rotate">旋转</button>
        </div>
      </div>
      <div class="controls">
        <button id="start-btn" class="control-btn control-btn-primary" type="button">开始</button>
        <button id="pause-btn" class="control-btn" type="button">暂停</button>
        <button class="control-btn" type="button" data-action="drop">落底</button>
      </div>
    </section>
  </main>

  <script src="./script.js"></script>
</body>
</html>
